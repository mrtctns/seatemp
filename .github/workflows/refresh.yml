name: Refresh feed

# Twice a day. The satellite analysis publishes once daily, so one run would be
# enough on a good day — the second is there because NOAA CoastWatch returns
# 502s and 503s in spells, and a single missed run would leave every phone on
# yesterday's number with no way to recover until tomorrow.
on:
  schedule:
    - cron: "20 5 * * *"
    - cron: "20 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # A slow run must never overlap the next one and race it to the same files.
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Roomier than the daily feed alone needs. The history step usually adds one
    # day's grids, but after a night of 502s it catches up on several at once,
    # and the endpoint has slow spells where a block takes the best part of a
    # minute.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the feed
        run: python3 tools/update_feed.py

      # Only on the morning run. The history window moves once a day, so the
      # evening pass would redo an hour of work to produce the same seven days;
      # the daily feed still refreshes twice, because that is the number people
      # actually open the app for.
      #
      # Failure here is not failure of the run. The history card is a premium
      # extra and it falls back to the copy already published; the temperature
      # every user opens the app for has already been written by the step above
      # and must still be committed.
      - name: Roll the history feed forward
        if: github.event.schedule != '20 17 * * *'
        continue-on-error: true
        # No --full. That refetches both seven-day windows and takes hours; this
        # fetches only the days the published files are missing, which is one on
        # a normal morning and however many are outstanding after a bad night.
        run: python3 tools/build_history.py

      - name: Check the run produced something
        # update_feed.py leaves the previous files in place when a region fails,
        # so an empty or missing v1/ means the job broke rather than that the sea
        # has no temperature today. Fail loudly instead of committing nothing.
        run: |
          count=$(ls v1/*.json 2>/dev/null | wc -l)
          echo "$count country files"
          test "$count" -gt 0

      - name: Commit
        run: |
          git config user.name "seatemp bot"
          git config user.email "actions@github.com"
          git add v1
          # Nothing to commit is a normal outcome: if every reading is unchanged
          # the files are byte-identical. Only the timestamp moves, so this
          # mostly does commit — but an empty commit must not fail the run.
          git diff --staged --quiet || git commit -m "feed: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
